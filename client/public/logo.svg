<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="50%" stop-color="#4A6CF7"/>
      <stop offset="100%" stop-color="#2B4CE8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  
  <!-- Glass shine -->
  <rect width="512" height="260" rx="108" ry="108" fill="url(#shine)"/>
  
  <!-- Y letter - clear fork shape, not X -->
  <!-- Left arm going up-left -->
  <path d="M85 100 L195 260 L85 420 L155 420 L210 320 L210 420 L255 420 L255 320 L310 420 L380 420 L270 260 L380 100 L310 100 L255 195 L200 100 Z" 
        fill="white" filter="url(#glow)"/>
  
  <!-- O letter - thick, bold -->
  <circle cx="435" cy="260" r="80" fill="none" stroke="white" stroke-width="42" filter="url(#glow)"/>
  
  <!-- Accent dot -->
  <circle cx="485" cy="110" r="10" fill="white" opacity="0.5"/>
</svg>
