<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="50%" stop-color="#4A6CF7"/>
      <stop offset="100%" stop-color="#2B4CE8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" ry="108" fill="url(#bg)"/>
  
  <!-- Glass shine effect -->
  <rect width="512" height="280" rx="108" ry="108" fill="url(#shine)"/>
  
  <!-- Y letter - bold, modern -->
  <path d="M100 110 L175 250 L100 400 L165 400 L210 310 L255 400 L320 400 L245 250 L320 110 L255 110 L210 200 L165 110 Z" 
        fill="white" filter="url(#glow)"/>
  
  <!-- O letter - bold, modern with gap -->
  <ellipse cx="395" cy="255" rx="70" ry="120" fill="none" stroke="white" stroke-width="38" filter="url(#glow)"/>
  
  <!-- Subtle dot accent -->
  <circle cx="460" cy="130" r="12" fill="white" opacity="0.6"/>
</svg>
