# Render Blueprint — deploy "Your One" with one click after connecting the repo.
# Render runs: npm install (installs server + client deps), then npm run build (builds React),
# then npm start (runs the Express server on port 3001).
services:
  - type: web
    name: your-one
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      # These three come from your Supabase project. Add them in Render:
      # Dashboard -> your service -> Environment -> Environment Variables
      #   DATABASE_URL              = your Supabase Postgres connection URI
      #   SUPABASE_URL              = https://<project>.supabase.co
      #   SUPABASE_SERVICE_ROLE_KEY = your service_role key
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
